.tg{cursor:pointer;border:0;background:transparent;color:inherit;padding:0 4px}
.tag{font-size:11.5px;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:0 7px;font-weight:400}
.pend{margin-top:24px;border:2px dashed var(--line);border-radius:8px;padding:10px 12px}

<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let BD=null,COL=new Set();
const sl=d=>d?d.replace(/-/g,"/"):"";
const kindOf=n=>(BD.tracks.find(t=>t.name==n)||{}).kind||"side";
const dc=i=>i.start_date?`<b>${sl(i.start_date)}</b>`+(i.end_date&&i.end_date!=i.start_date?`<div class="mut">～ ${sl(i.end_date)}</div>`:""):`<span class="mut">${E(i.date_text||"未定")}</span>`;
function row(i,cls,ind,kids,key){return `<div class="r grid ${cls} kind-${kindOf(i.track)}"><div>${dc(i)}</div><div style="padding-left:${ind}px">${kids?`<button class="tg" data-k="${key}">${COL.has(key)?"▸":"▾"}</button>`:'<span style="display:inline-block;width:24px"></span>'}${cls=="ms"?"◆ ":""}${E(i.name)}${i.tbd?' <span class="tag">待確認</span>':""}${i.note?`<div class="mut" style="font-weight:400;font-size:12px;padding-left:24px">${E(i.note)}</div>`:""}</div><div>${E(i.status)}</div><div class="mut">${E(i.owner)}</div><div class="mut">${E(i.progress_note)}</div></div>`}
function render(){const q=$("#q").value.trim(),I=BD.items,hit=i=>!q||(i.name+i.note+i.owner).includes(q);
 const kids=(p,l)=>I.filter(x=>x.parent_id==p&&x.level==l).sort((a,b)=>a.sort-b.sort);
 let h=`<div class="grid hd"><div>日期</div><div>項目</div><div>狀態</div><div>負責窗口</div><div>進度說明</div></div>`;
 const sub=(k,ind)=>{const s=kids(k.id,"執行細項");h+=row(k,"task",ind,s.length,"K:"+k.id);if(!COL.has("K:"+k.id))s.filter(hit).forEach(x=>h+=row(x,"sub",ind+20,0,""))};
 BD.tracks.filter(t=>t.kind!="pending").forEach(t=>{const key="T:"+t.name;
  const ms=I.filter(x=>x.track==t.name&&x.level=="里程碑").sort((a,b)=>(a.start_date||"9999").localeCompare(b.start_date||"9999")||a.sort-b.sort);
  h+=`<div class="th kind-${t.kind} ${t.kind=="final"?"final":""}"><button class="tg" style="color:#fff" data-k="${E(key)}">${COL.has(key)?"▸":"▾"}</button>${t.kind=="final"?"★ ":""}${E(t.name)}${t.kind=="final"?"　最終目標":""}</div>`;
  if(COL.has(key))return;
  ms.forEach(m=>{const tk=kids(m.id,"任務");h+=row(m,"ms",0,tk.length,"M:"+m.id);if(!COL.has("M:"+m.id))tk.filter(k=>hit(k)||kids(k.id,"執行細項").some(hit)).forEach(k=>sub(k,18))});
  I.filter(x=>x.track==t.name&&x.parent_id==null&&x.level=="任務").sort((a,b)=>a.sort-b.sort).filter(hit).forEach(k=>sub(k,18))});
 $("#board").innerHTML=h;
 const P=I.filter(x=>x.track=="待確認"&&x.level!="執行細項");
 $("#pend").innerHTML=`<b style="font-size:16px">待確認</b> <span class="mut">還沒放進時程表的事項</span>`+(P.map(i=>`<div class="r grid kind-pending" style="margin-top:6px"><div>${dc(i)}</div><div><b>${E(i.name)}</b>${i.note?`<div class="mut" style="font-size:12px">${E(i.note)}</div>`:""}</div><div>${E(i.status)}</div><div class="mut">${E(i.owner)}</div><div class="mut">${E(i.progress_note)}</div></div>`).join("")||'<div class="mut">目前沒有</div>')}
function lv(n){COL=new Set();if(n<2)BD.tracks.forEach(t=>COL.add("T:"+t.name));BD.items.forEach(i=>{if(n<3&&i.level=="里程碑")COL.add("M:"+i.id);if(n<4&&i.level=="任務")COL.add("K:"+i.id)});render()}
async function load(){if(window.__DATA__){BD=window.__DATA__;$("#login").style.display="none";$("#app").style.display="block";$("#asof").textContent="唯讀檢視　｜　資料更新時間："+(BD.as_of||"").replace("T"," ");return render()}
 const r=await fetch("/api/share/board");if(r.status==401){$("#login").style.display="block";$("#app").style.display="none";return}
 BD=await r.json();$("#login").style.display="none";$("#app").style.display="block";$("#asof").textContent="唯讀檢視　｜　只能看，不能改　｜　資料更新時間："+(BD.as_of||"").replace("T"," ");render()}
$("#go").onclick=async()=>{const r=await fetch("/api/share/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:$("#code").value})});const d=await r.json();if(d.ok)load();else $("#msg").textContent=d.error};
$("#code").onkeydown=e=>{if(e.key=="Enter")$("#go").click()};
document.addEventListener("click",e=>{const b=e.target.closest("button[data-k]");if(b){COL.has(b.dataset.k)?COL.delete(b.dataset.k):COL.add(b.dataset.k);render()}});
$("#q").oninput=()=>BD&&render();[1,2,3,4].forEach(n=>$("#b"+n).onclick=()=>lv(n));load();
</script></body></html>
